<script type="module">
window.__progress('загрузка three.js…');
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
window.__progress('модули загружены, инициализация…');

/* =========================================================
   БАЗА
========================================================= */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 100000);
camera.position.set(0, 25, 70);

const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.minDistance = 1.5;
controls.maxDistance = 8000;

scene.add(new THREE.AmbientLight(0xffffff, 0.35));
const sunLight = new THREE.PointLight(0xfff2d8, 4.5, 0, 0);
scene.add(sunLight);
const rimLight = new THREE.DirectionalLight(0x6688cc, 0.3);
rimLight.position.set(-1, 0.5, -1);
scene.add(rimLight);

/* =========================================================
   POST-PROCESSING
========================================================= */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(innerWidth, innerHeight), 0.65, 0.55, 0.5);
composer.addPass(bloomPass);

const LensingShader = {
  uniforms: {
    tDiffuse: { value: null }, uCenter: { value: new THREE.Vector2(0.5, 0.5) },
    uStrength: { value: 0.0 }, uRadius: { value: 0.1 }, uTime: { value: 0 }
  },
  vertexShader: `varying vec2 vUv;
    void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform vec2 uCenter;
    uniform float uStrength, uRadius, uTime;
    varying vec2 vUv;
    void main(){
      vec2 uv = vUv;
      if (uStrength > 0.001){
        float aspect = 1.6;
        vec2 d = uv - uCenter; d.x *= aspect;
        float r = length(d);
        float inf = uRadius / max(r, 0.001);
        inf = smoothstep(uRadius*1.8, uRadius*0.3, r) * inf;
        vec2 dir = normalize(d + 0.0001);
        vec2 w = uv - dir * (inf * uStrength * 0.15);
        float ang = inf * uStrength * 1.2;
        mat2 rot = mat2(cos(ang), -sin(ang), sin(ang), cos(ang));
        vec2 c = w - uCenter; c.x *= aspect; c = rot * c; c.x /= aspect;
        w = c + uCenter;
        vec3 col = texture2D(tDiffuse, w).rgb;
        float eR = uRadius * 0.95;
        float ring = exp(-abs(r - eR) * 60.0) * uStrength;
        col += vec3(1.0, 0.85, 0.6) * ring * 1.5;
        col *= mix(1.0, 0.15, smoothstep(uRadius*0.55, uRadius*0.4, r));
        gl_FragColor = vec4(col, 1.0);
      } else { gl_FragColor = texture2D(tDiffuse, uv); }
    }`
};
const lensingPass = new ShaderPass(LensingShader);
lensingPass.uniforms.uStrength.value = 0;
composer.addPass(lensingPass);

const PostFxShader = {
  uniforms: {
    tDiffuse: { value: null }, uTime: { value: 0 },
    uChroma: { value: 0.0022 }, uVignette: { value: 0.55 }, uGrain: { value: 0.025 },
    uResolution: { value: new THREE.Vector2(innerWidth, innerHeight) }
  },
  vertexShader: `varying vec2 vUv;
    void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform float uTime, uChroma, uVignette, uGrain;
    uniform vec2 uResolution;
    varying vec2 vUv;
    float rand(vec2 co){ return fract(sin(dot(co, vec2(12.9898, 78.233))) * 43758.5453); }
    void main(){
      vec2 uv = vUv;
      vec2 center = vec2(0.5);
      vec2 dir = uv - center;
      float dist = length(dir);
      float amount = uChroma * dist * dist * 3.0;
      vec3 col;
      col.r = texture2D(tDiffuse, uv - dir * amount).r;
      col.g = texture2D(tDiffuse, uv).g;
      col.b = texture2D(tDiffuse, uv + dir * amount).b;
      float vig = 1.0 - smoothstep(0.35, 0.95, dist);
      col *= mix(1.0 - uVignette, 1.0, vig);
      float g = rand(uv * uResolution + uTime) - 0.5;
      col += g * uGrain;
      gl_FragColor = vec4(col, 1.0);
    }`
};
const postFxPass = new ShaderPass(PostFxShader);
composer.addPass(postFxPass);
composer.addPass(new OutputPass());

/* =========================================================
   ШУМ
========================================================= */
const GLSL_NOISE = `
vec3 mod289(vec3 x){ return x - floor(x*(1.0/289.0))*289.0; }
vec4 mod289(vec4 x){ return x - floor(x*(1.0/289.0))*289.0; }
vec4 permute(vec4 x){ return mod289(((x*34.0)+1.0)*x); }
vec4 taylorInvSqrt(vec4 r){ return 1.79284291400159 - 0.85373472095314 * r; }
float snoise(vec3 v){
  const vec2 C = vec2(1.0/6.0, 1.0/3.0);
  const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
  vec3 i = floor(v + dot(v, C.yyy));
  vec3 x0 = v - i + dot(i, C.xxx);
  vec3 g = step(x0.yzx, x0.xyz);
  vec3 l = 1.0 - g;
  vec3 i1 = min(g.xyz, l.zxy);
  vec3 i2 = max(g.xyz, l.zxy);
  vec3 x1 = x0 - i1 + C.xxx;
  vec3 x2 = x0 - i2 + C.yyy;
  vec3 x3 = x0 - D.yyy;
  i = mod289(i);
  vec4 p = permute(permute(permute(
    i.z + vec4(0.0, i1.z, i2.z, 1.0))
    + i.y + vec4(0.0, i1.y, i2.y, 1.0))
    + i.x + vec4(0.0, i1.x, i2.x, 1.0));
  float n_ = 0.142857142857;
  vec3 ns = n_ * D.wyz - D.xzx;
  vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
  vec4 x_ = floor(j * ns.z);
  vec4 y_ = floor(j - 7.0 * x_);
  vec4 x = x_ * ns.x + ns.yyyy;
  vec4 y = y_ * ns.x + ns.yyyy;
  vec4 h = 1.0 - abs(x) - abs(y);
  vec4 b0 = vec4(x.xy, y.xy);
  vec4 b1 = vec4(x.zw, y.zw);
  vec4 s0 = floor(b0)*2.0 + 1.0;
  vec4 s1 = floor(b1)*2.0 + 1.0;
  vec4 sh = -step(h, vec4(0.0));
  vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
  vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
  vec3 p0 = vec3(a0.xy, h.x);
  vec3 p1 = vec3(a0.zw, h.y);
  vec3 p2 = vec3(a1.xy, h.z);
  vec3 p3 = vec3(a1.zw, h.w);
  vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
  p0*=norm.x; p1*=norm.y; p2*=norm.z; p3*=norm.w;
  vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
  m = m*m;
  return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
}
float fbm(vec3 p){
  float v = 0.0, a = 0.5;
  for (int i=0;i<5;i++){ v += a*snoise(p); p *= 2.02; a *= 0.5; }
  return v;
}
`;

/* =========================================================
   НАСТРОЙКИ
========================================================= */
const Q = {
  sphereSeg: 64,
  particleScale: 0.7,
  starCount: 8000,
  texSize: 256
};

/* =========================================================
   ЗАГРУЗКА ТЕКСТУР NASA (не блокирует старт)
========================================================= */
const REAL_TEX = {
  earth: null, earthNormal: null, earthSpecular: null,
  earthClouds: null, earthLights: null, moon: null
};

function tryLoadTexture(url, key, isColor){
  const loader = new THREE.TextureLoader();
  loader.crossOrigin = 'anonymous';
  loader.load(url,
    tex => {
      if (isColor) tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 4;
      REAL_TEX[key] = tex;
      console.log('[NASA] загружено:', key);
    },
    undefined,
    () => { console.warn('[NASA] не удалось загрузить', key, '— используется процедурный fallback'); }
  );
}

const BASE = 'https://unpkg.com/three@0.160.0/examples/textures/planets/';
tryLoadTexture(BASE + 'earth_atmos_2048.jpg', 'earth', true);
tryLoadTexture(BASE + 'earth_normal_2048.jpg', 'earthNormal', false);
tryLoadTexture(BASE + 'earth_specular_2048.jpg', 'earthSpecular', false);
tryLoadTexture(BASE + 'earth_clouds_1024.png', 'earthClouds', true);
tryLoadTexture(BASE + 'earth_lights_2048.png', 'earthLights', true);
tryLoadTexture(BASE + 'moon_1024.jpg', 'moon', true);

/* =========================================================
   ХЕЛПЕРЫ
========================================================= */
const sceneRoot = new THREE.Group();
scene.add(sceneRoot);
const updaters = [];
let currentIdx = -1;

function clearScene(){
  while (sceneRoot.children.length){
    const c = sceneRoot.children[0];
    sceneRoot.remove(c);
    c.traverse(o => {
      if (o.geometry) o.geometry.dispose();
      if (o.material){
        const mats = Array.isArray(o.material) ? o.material : [o.material];
        mats.forEach(m => {
          Object.values(m).forEach(v => {
            if (v && v.isTexture){
              const realTextures = [REAL_TEX.earth, REAL_TEX.earthNormal,
                REAL_TEX.earthSpecular, REAL_TEX.earthClouds,
                REAL_TEX.earthLights, REAL_TEX.moon].filter(Boolean);
              if (!realTextures.includes(v)) v.dispose();
            }
          });
          m.dispose();
        });
      }
    });
  }
  updaters.length = 0;
  lensingPass.uniforms.uStrength.value = 0;
}

function makeGlowTex(inner, outer){
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(64,64,0, 64,64,64);
  g.addColorStop(0, inner);
  g.addColorStop(0.2, outer);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(c);
}

function makeCloudTex(r, g, b){
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const ctx = c.getContext('2d');
  const gr = ctx.createRadialGradient(64,64,0, 64,64,64);
  gr.addColorStop(0, `rgba(${r},${g},${b},1)`);
  gr.addColorStop(0.4, `rgba(${r},${g},${b},0.5)`);
  gr.addColorStop(0.8, `rgba(${r},${g},${b},0.1)`);
  gr.addColorStop(1, `rgba(${r},${g},${b},0)`);
  ctx.fillStyle = gr; ctx.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(c);
}

function makeLabel(text, sub, width=10, color='#ffffff', subColor='#aaccff'){
  const cv = document.createElement('canvas');
  cv.width = 1024; cv.height = 256;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = color;
  ctx.font = 'bold 84px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.shadowColor = '#4488ff'; ctx.shadowBlur = 24;
  ctx.fillText(text, 512, 110);
  if (sub){
    ctx.shadowBlur = 12;
    ctx.font = '44px system-ui, sans-serif';
    ctx.fillStyle = subColor;
    ctx.fillText(sub, 512, 200);
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.anisotropy = 4;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({
    map: tex, transparent:true, depthTest:false, depthWrite:false }));
  sp.scale.set(width, width * 0.25, 1);
  return sp;
}

function makeStarField(count){
  const geo = new THREE.BufferGeometry();
  const pos = [], col = [], sizes = [];
  const spectral = [
    { c: [0.62, 0.72, 1.00], w: 0.005 },
    { c: [0.72, 0.82, 1.00], w: 0.015 },
    { c: [0.90, 0.95, 1.00], w: 0.06  },
    { c: [1.00, 0.98, 0.90], w: 0.10  },
    { c: [1.00, 0.95, 0.75], w: 0.22  },
    { c: [1.00, 0.85, 0.60], w: 0.30  },
    { c: [1.00, 0.72, 0.55], w: 0.30  }
  ];
  const totalW = spectral.reduce((s, sp) => s + sp.w, 0);
  function pickColor(){
    let r = Math.random() * totalW;
    for (const sp of spectral){ r -= sp.w; if (r <= 0) return sp.c; }
    return spectral[spectral.length-1].c;
  }
  for (let i=0; i<count; i++){
    const r = 2000 + Math.random()*5000;
    const t = Math.random()*Math.PI*2;
    const p = Math.acos(2*Math.random()-1);
    pos.push(r*Math.sin(p)*Math.cos(t), r*Math.cos(p), r*Math.sin(p)*Math.sin(t));
    const c = pickColor();
    col.push(c[0], c[1], c[2]);
    sizes.push(0.8 + Math.pow(Math.random(), 3) * 4);
  }
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  geo.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));
  const mat = new THREE.ShaderMaterial({
    uniforms: {},
    vertexShader: `
      attribute float size;
      attribute vec3 color;
      varying vec3 vColor;
      void main(){
        vColor = color;
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = size * (200.0 / -mv.z) * 3.0;
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      varying vec3 vColor;
      void main(){
        vec2 uv = gl_PointCoord - 0.5;
        float d = length(uv);
        if (d > 0.5) discard;
        float alpha = smoothstep(0.5, 0.05, d);
        gl_FragColor = vec4(vColor * alpha, alpha);
      }`,
    transparent: true, depthWrite: false,
    blending: THREE.AdditiveBlending, vertexColors: true
  });
  return new THREE.Points(geo, mat);
}

function generateHeightmap(size, seed, opts){
  const cv = document.createElement('canvas');
  cv.width = size; cv.height = size/2;
  const ctx = cv.getContext('2d');
  const img = ctx.createImageData(cv.width, cv.height);
  const d = img.data;
  const perm = new Uint8Array(512);
  const basePerm = new Uint8Array(256);
  for (let i=0; i<256; i++) basePerm[i] = i;
  let s0 = Math.floor(seed) || 12345;
  const rand = () => { s0 = (s0 * 1664525 + 1013904223) % 4294967296; return s0 / 4294967296; };
  for (let i=255; i>0; i--){
    const j = Math.floor(rand() * (i+1));
    [basePerm[i], basePerm[j]] = [basePerm[j], basePerm[i]];
  }
  for (let i=0; i<512; i++) perm[i] = basePerm[i & 255];
  const fade = t => t*t*t*(t*(t*6 - 15) + 10);
  const lerp = (a,b,t) => a + (b-a)*t;
  const hash = (x,y) => perm[(perm[x & 255] + y) & 255] / 255;
  const vn = (x,y) => {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const u = fade(xf), v = fade(yf);
    return lerp(lerp(hash(xi,yi), hash(xi+1,yi), u),
                lerp(hash(xi,yi+1), hash(xi+1,yi+1), u), v);
  };
  const fbm2 = (x,y,s) => {
    let v = 0, amp = 0.5, freq = 1;
    for (let i=0; i<5; i++){ v += amp * vn(x*freq + s*0.13, y*freq + s*0.07); freq *= 2; amp *= 0.5; }
    return v;
  };
  const strength = opts.strength || 1;
  for (let y=0; y<cv.height; y++){
    for (let x=0; x<cv.width; x++){
      const nx = x / cv.width, ny = y / cv.height;
      let h = fbm2(nx * 6 * strength, ny * 6 * strength, seed);
      if (opts.bands){
        const band = Math.sin(ny * Math.PI * opts.bands) * 0.5 + 0.5;
        h = h * 0.55 + band * 0.45;
      }
      if (opts.poles){
        const pole = Math.pow(Math.abs(ny - 0.5)*2, 4);
        h = Math.max(h, pole * 0.85);
      }
      const v = Math.floor(Math.max(0, Math.min(1, h)) * 255);
      const idx = (y * cv.width + x) * 4;
      d[idx] = d[idx+1] = d[idx+2] = v;
      d[idx+3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  return cv;
}

function heightmapToNormal(srcCanvas){
  const W = srcCanvas.width, H = srcCanvas.height;
  const src = srcCanvas.getContext('2d').getImageData(0,0,W,H).data;
  const out = document.createElement('canvas');
  out.width = W; out.height = H;
  const outCtx = out.getContext('2d');
  const img = outCtx.createImageData(W, H);
  const d = img.data;
  const get = (x,y) => {
    x = (x+W)%W; y = (y+H)%H;
    return src[(y*W + x)*4] / 255;
  };
  for (let y=0; y<H; y++){
    for (let x=0; x<W; x++){
      const l = get(x-1,y), r = get(x+1,y);
      const u = get(x,y-1), dn = get(x,y+1);
      const dx = (r-l)*4, dy = (dn-u)*4;
      const len = Math.sqrt(dx*dx + dy*dy + 1);
      const idx = (y*W + x) * 4;
      d[idx] = ((dx/len)*0.5 + 0.5) * 255;
      d[idx+1] = ((dy/len)*0.5 + 0.5) * 255;
      d[idx+2] = ((1/len)*0.5 + 0.5) * 255;
      d[idx+3] = 255;
    }
  }
  outCtx.putImageData(img, 0, 0);
  return out;
}

function makePlanetMaterial(opts){
  const size = Q.texSize;
  const heightC = generateHeightmap(size, opts.seed || Math.random()*100, {
    bands: opts.bands, poles: opts.poles, strength: opts.strength || 1 });
  const normalC = heightmapToNormal(heightC);
  const diffC = document.createElement('canvas');
  diffC.width = heightC.width; diffC.height = heightC.height;
  const dctx = diffC.getContext('2d');
  dctx.drawImage(heightC, 0, 0);
  const dimg = dctx.getImageData(0, 0, diffC.width, diffC.height);
  const dd = dimg.data;
  const cA = new THREE.Color(opts.colorA);
  const cB = new THREE.Color(opts.colorB);
  for (let i=0; i<dd.length; i+=4){
    const t = dd[i] / 255;
    dd[i]   = (cA.r*(1-t) + cB.r*t) * 255;
    dd[i+1] = (cA.g*(1-t) + cB.g*t) * 255;
    dd[i+2] = (cA.b*(1-t) + cB.b*t) * 255;
  }
  dctx.putImageData(dimg, 0, 0);
  const diff = new THREE.CanvasTexture(diffC);
  diff.colorSpace = THREE.SRGBColorSpace;
  const norm = new THREE.CanvasTexture(normalC);
  return new THREE.MeshStandardMaterial({
    map: diff, normalMap: norm,
    normalScale: new THREE.Vector2(1.4, 1.4),
    roughness: opts.roughness ?? 0.9,
    metalness: opts.metalness ?? 0.0
  });
}

/* Атмосфера с Fresnel rim */
function makeAtmosphere(planetRadius, color, intensity){
  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uColor: { value: new THREE.Color(color) },
      uIntensity: { value: intensity || 1.0 }
    },
    vertexShader: `
      varying vec3 vNormal;
      varying vec3 vView;
      void main(){
        vNormal = normalize(normalMatrix * normal);
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        vView = normalize(-mv.xyz);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      uniform vec3 uColor;
      uniform float uIntensity;
      varying vec3 vNormal;
      varying vec3 vView;
      void main(){
        float rim = 1.0 - abs(dot(normalize(vNormal), normalize(vView)));
        rim = pow(rim, 3.0);
        gl_FragColor = vec4(uColor * uIntensity, rim * 0.8);
      }`,
    transparent: true, depthWrite: false,
    blending: THREE.AdditiveBlending, side: THREE.BackSide
  });
  return new THREE.Mesh(
    new THREE.SphereGeometry(planetRadius * 1.08, 48, 48),
    mat
  );
}

/* Кольца */
function makeRingTexture(){
  const w = 1024, h = 8;
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  for (let x=0; x<w; x++){
    const t = x / w;
    let a = 0.55;
    a += Math.sin(t * 80) * 0.15;
    a += Math.sin(t * 40 + 1.3) * 0.15;
    a += Math.sin(t * 150 + 2.7) * 0.1;
    if (t < 0.06) a *= t / 0.06;
    if (t > 0.94) a *= (1 - t) / 0.06;
    if (Math.abs(t - 0.42) < 0.02) a *= 0.1;
    if (Math.abs(t - 0.72) < 0.015) a *= 0.15;
    a = Math.max(0, Math.min(1, a));
    const c = Math.floor(210 + Math.sin(t*60)*20);
    ctx.fillStyle = `rgba(${c},${c-15},${c-40},${a})`;
    ctx.fillRect(x, 0, 1, h);
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.wrapS = THREE.ClampToEdgeWrapping;
  return tex;
}

function makeSaturnRings(innerR, outerR){
  const group = new THREE.Group();
  const tex = makeRingTexture();
  const ringGeo = new THREE.RingGeometry(innerR, outerR, 128, 1);
  const pos = ringGeo.attributes.position;
  const uv = ringGeo.attributes.uv;
  for (let i=0; i<pos.count; i++){
    const x = pos.getX(i), y = pos.getY(i);
    const r = Math.sqrt(x*x + y*y);
    const t = (r - innerR) / (outerR - innerR);
    uv.setXY(i, t, 0.5);
  }
  uv.needsUpdate = true;
  const mat = new THREE.MeshBasicMaterial({
    map: tex, side: THREE.DoubleSide,
    transparent: true, depthWrite: false, opacity: 0.95
  });
  const ring = new THREE.Mesh(ringGeo, mat);
  ring.rotation.x = -Math.PI/2;
  group.add(ring);
  return group;
}

/* Галактика */
function makeGalaxy(config){
  const group = new THREE.Group();
  const { radius, armCount, starCount, dustCount, cA, cB, cCore } = config;
  const core = new THREE.Mesh(
    new THREE.SphereGeometry(radius * 0.12, 24, 24),
    new THREE.MeshBasicMaterial({ color: cCore || 0xfff2c0 }));
  group.add(core);
  const coreGlow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: makeGlowTex('rgba(255,250,220,1)', 'rgba(255,220,140,0.6)'),
    transparent:true, blending:THREE.AdditiveBlending, depthWrite:false }));
  coreGlow.scale.set(radius*1.2, radius*1.2, 1);
  group.add(coreGlow);

  const starPos = [], starCol = [];
  const A = new THREE.Color(cA), B = new THREE.Color(cB);
  for (let i=0; i<starCount; i++){
    const arm = Math.floor(Math.random() * armCount);
    const r = Math.pow(Math.random(), 0.7) * radius;
    const armAngle = (arm / armCount) * Math.PI * 2;
    const angle = armAngle + r * 1.8;
    const spread = (1 - r/radius) * radius * 0.15 + 0.4;
    starPos.push(
      Math.cos(angle)*r + (Math.random()-0.5)*spread,
      (Math.random()-0.5)*radius*0.06,
      Math.sin(angle)*r + (Math.random()-0.5)*spread );
    const c = A.clone().lerp(B, Math.random());
    starCol.push(c.r, c.g, c.b);
  }
  const starGeo = new THREE.BufferGeometry();
  starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
  starGeo.setAttribute('color', new THREE.Float32BufferAttribute(starCol, 3));
  group.add(new THREE.Points(starGeo, new THREE.PointsMaterial({
    size:0.18, vertexColors:true, transparent:true, opacity:0.95,
    blending:THREE.AdditiveBlending, sizeAttenuation:true, depthWrite:false })));

  if (dustCount > 0){
    const dustPos = [], dustCol = [];
    for (let i=0; i<dustCount; i++){
      const arm = Math.floor(Math.random() * armCount);
      const r = Math.pow(Math.random(), 0.6) * radius * 0.95;
      const armAngle = (arm / armCount) * Math.PI * 2;
      const angle = armAngle + r * 1.8 + 0.6;
      const spread = (1 - r/radius) * radius * 0.2 + 0.5;
      dustPos.push(
        Math.cos(angle)*r + (Math.random()-0.5)*spread,
        (Math.random()-0.5)*radius*0.03,
        Math.sin(angle)*r + (Math.random()-0.5)*spread );
      const v = 0.15 + Math.random()*0.2;
      dustCol.push(v, v*0.6, v*0.4);
    }
    const dustGeo = new THREE.BufferGeometry();
    dustGeo.setAttribute('position', new THREE.Float32BufferAttribute(dustPos, 3));
    dustGeo.setAttribute('color', new THREE.Float32BufferAttribute(dustCol, 3));
    group.add(new THREE.Points(dustGeo, new THREE.PointsMaterial({
      size:0.22, vertexColors:true, transparent:true, opacity:0.5,
      sizeAttenuation:true, depthWrite:false })));
  }
  return group;
}

/* =========================================================
   1. СОЛНЕЧНАЯ СИСТЕМА
========================================================= */
function buildSolar(){
  window.__progress('сцена 1: Солнечная система…');
  const g = new THREE.Group();

  // Солнце
  const sunUniforms = { uTime: { value: 0 } };
  const sunMat = new THREE.ShaderMaterial({
    uniforms: sunUniforms,
    vertexShader: `varying vec3 vPos;
      void main(){ vPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `${GLSL_NOISE}
      uniform float uTime; varying vec3 vPos;
      void main(){
        vec3 p = normalize(vPos);
        float t = uTime * 0.15;
        float n1 = fbm(p * 3.5 + vec3(t));
        float n2 = fbm(p * 8.0 - vec3(t*1.3));
        float n3 = fbm(p * 20.0 + vec3(t*2.5));
        float heat = n1*0.4 + n2*0.35 + n3*0.15 + 0.3;
        float prom = pow(max(0.0, n1 - 0.5), 2.0) * 3.0;
        vec3 col = mix(vec3(1.0,0.35,0.05), vec3(1.0,0.7,0.2), heat);
        col = mix(col, vec3(1.0,1.0,0.9), pow(heat, 3.0)*0.9);
        col = mix(col, vec3(1.0,1.0,1.0), prom * 0.4);
        gl_FragColor = vec4(col, 1.0);
      }`
  });
  g.add(new THREE.Mesh(new THREE.SphereGeometry(5.5, Q.sphereSeg, Q.sphereSeg), sunMat));

  for (let i=0; i<4; i++){
    const s = new THREE.Sprite(new THREE.SpriteMaterial({
      map: makeGlowTex('rgba(255,250,220,1)', 'rgba(255,180,60,0.4)'),
      transparent:true, blending:THREE.AdditiveBlending, depthWrite:false }));
    const size = 18 + i*8;
    s.scale.set(size, size, 1);
    s.userData = { base: size, phase: i*0.7 };
    g.add(s);
    updaters.push((t) => {
      const k = s.userData.base * (1 + Math.sin(t*1.5 + s.userData.phase) * 0.08);
      s.scale.set(k, k, 1);
    });
  }
  updaters.push((t) => { sunUniforms.uTime.value = t; });

  // Планеты — все с mat (fallback), earth дополнительно опционально
  const planets = [
    { d:12, s:0.55, sp:1.6,
      mat:{ colorA:'#3a3a3a', colorB:'#9a9a9a', seed:1 },
      atmo:null, tilt:0, rot:0.05 },
    { d:17, s:0.85, sp:1.15,
      mat:{ colorA:'#7a4818', colorB:'#f0d098', seed:2, bands:5 },
      atmo:{c:0xffe0a0, i:0.7}, tilt:0.05, rot:0.02 },
    { d:23, s:0.9, sp:1.0, moon:true, earth:true,
      mat:{ colorA:'#1a3a6a', colorB:'#8a6a3a', seed:3, water:true, poles:true },
      atmo:{c:0x6699ff, i:1.4}, tilt:0.41, rot:0.5 },
    { d:30, s:0.65, sp:0.8,
      mat:{ colorA:'#5a2010', colorB:'#d87850', seed:4, poles:true },
      atmo:{c:0xff8855, i:0.5}, tilt:0.44, rot:0.5 },
    { d:44, s:2.4, sp:0.42, jupiter:true,
      mat:{ colorA:'#5a3010', colorB:'#f0d0a0', seed:5, bands:9 },
      atmo:{c:0xffcc88, i:0.6}, tilt:0.05, rot:1.2 },
    { d:60, s:2.1, sp:0.32, ring:true, saturn:true,
      mat:{ colorA:'#c8a878', colorB:'#f0d9b0', seed:6, bands:6 },
      atmo:{c:0xffddaa, i:0.5}, tilt:0.47, rot:1.2 },
    { d:76, s:1.5, sp:0.22,
      mat:{ colorA:'#4a98a8', colorB:'#c8f0f8', seed:7, bands:3 },
      atmo:{c:0x88ddff, i:0.9}, tilt:1.7, rot:0.6 },
    { d:90, s:1.4, sp:0.16,
      mat:{ colorA:'#2a4ac0', colorB:'#7090e0', seed:8, bands:4 },
      atmo:{c:0x5588ff, i:0.8}, tilt:0.49, rot:0.6 }
  ];

  planets.forEach(p => {
    const orbit = new THREE.Mesh(
      new THREE.RingGeometry(p.d - 0.05, p.d + 0.05, 96),
      new THREE.MeshBasicMaterial({
        color:0x5577bb, side:THREE.DoubleSide,
        transparent:true, opacity:0.22 }));
    orbit.rotation.x = Math.PI/2;
    g.add(orbit);

    // Всегда есть fallback. Если earth+загружена текстура — используем её.
    let mat;
    if (p.earth && REAL_TEX.earth){
      mat = new THREE.MeshStandardMaterial({
        map: REAL_TEX.earth,
        normalMap: REAL_TEX.earthNormal || undefined,
        normalScale: new THREE.Vector2(0.7, 0.7),
        roughnessMap: REAL_TEX.earthSpecular || undefined,
        roughness: 0.85, metalness: 0.05,
        emissiveMap: REAL_TEX.earthLights || undefined,
        emissive: 0xffcc66,
        emissiveIntensity: REAL_TEX.earthLights ? 0.6 : 0
      });
    } else if (p.jupiter){
      const W=1024, H=512;
      const cv = document.createElement('canvas'); cv.width=W; cv.height=H;
      const ctx = cv.getContext('2d');
      const bands = [
        ['#c9a882',0.00,0.07],['#e8d9b8',0.07,0.12],['#b8875a',0.12,0.20],
        ['#e8d9b8',0.20,0.26],['#c9a882',0.26,0.34],['#e8d9b8',0.34,0.42],
        ['#c9a882',0.42,0.50],['#b8875a',0.50,0.58],['#e8d9b8',0.58,0.66],
        ['#c9a882',0.66,0.74],['#b8875a',0.74,0.82],['#c9a882',0.82,0.90],
        ['#e8d9b8',0.90,1.00]
      ];
      bands.forEach(([c,y1,y2]) => {
        ctx.fillStyle = c;
        ctx.fillRect(0, y1*H, W, (y2-y1)*H);
      });
      for (let i=0; i<3000; i++){
        ctx.fillStyle = `rgba(${Math.random()>0.5?'255,255,255':'80,50,30'},${Math.random()*0.11})`;
        ctx.beginPath();
        ctx.ellipse(Math.random()*W, Math.random()*H,
          20 + Math.random()*100, 4 + Math.random()*16, 0, 0, Math.PI*2);
        ctx.fill();
      }
      const sx = W*0.62, sy = H*0.62, srx = W*0.075, sry = H*0.075;
      const rg = ctx.createRadialGradient(sx, sy, 0, sx, sy, srx);
      rg.addColorStop(0, '#ff9955'); rg.addColorStop(0.5, '#cc4422'); rg.addColorStop(1, '#8a2211');
      ctx.fillStyle = rg;
      ctx.beginPath();
      ctx.ellipse(sx, sy, srx, sry, 0, 0, Math.PI*2);
      ctx.fill();
      const tex = new THREE.CanvasTexture(cv);
      tex.colorSpace = THREE.SRGBColorSpace;
      const nm = heightmapToNormal(cv);
      const ntex = new THREE.CanvasTexture(nm);
      mat = new THREE.MeshStandardMaterial({
        map: tex, normalMap: ntex,
        normalScale: new THREE.Vector2(0.5, 0.5),
        roughness: 0.9
      });
    } else {
      mat = makePlanetMaterial(p.mat);
    }

    const mesh = new THREE.Mesh(new THREE.SphereGeometry(p.s, Q.sphereSeg, Q.sphereSeg), mat);
    mesh.userData = { angle: Math.random()*Math.PI*2, d:p.d, sp:p.sp, rotSpeed: p.rot || 0.1 };
    if (p.tilt) mesh.rotation.z = p.tilt;
    g.add(mesh);

    // Облака Земли — отдельный слой
    if (p.earth && REAL_TEX.earthClouds){
      const cloudMat = new THREE.MeshPhongMaterial({
        map: REAL_TEX.earthClouds,
        transparent: true, opacity: 0.7, depthWrite: false
      });
      const clouds = new THREE.Mesh(
        new THREE.SphereGeometry(p.s * 1.015, Q.sphereSeg, Q.sphereSeg),
        cloudMat
      );
      mesh.add(clouds);
      updaters.push((t, dt) => { clouds.rotation.y += dt * 0.08; });
    }

    if (p.atmo){
      mesh.add(makeAtmosphere(p.s, p.atmo.c, p.atmo.i));
    }

    if (p.moon){
      const moonMat = REAL_TEX.moon
        ? new THREE.MeshStandardMaterial({ map: REAL_TEX.moon, roughness: 1.0 })
        : makePlanetMaterial({ colorA:'#404040', colorB:'#c0c0c0', seed:11 });
      const moon = new THREE.Mesh(new THREE.SphereGeometry(0.22, 32, 32), moonMat);
      const moonPivot = new THREE.Group();
      moon.position.set(1.9, 0, 0);
      moonPivot.add(moon);
      moonPivot.rotation.z = 0.15;
      mesh.add(moonPivot);
      updaters.push((t, dt) => { moonPivot.rotation.y += dt * 1.4; });
    }

    if (p.ring){
      const rings = makeSaturnRings(p.s * 1.4, p.s * 2.4);
      rings.rotation.x = Math.PI/2 + 0.35;
      rings.rotation.z = 0.1;
      mesh.add(rings);
    }

    updaters.push((t, dt) => {
      mesh.userData.angle += dt * mesh.userData.sp * 0.5;
      mesh.position.set(
        Math.cos(mesh.userData.angle)*mesh.userData.d, 0,
        Math.sin(mesh.userData.angle)*mesh.userData.d );
      mesh.rotation.y += dt * mesh.userData.rotSpeed;
    });
  });

  // Пояс астероидов
  const astCount = 300;
  const baseGeo = new THREE.IcosahedronGeometry(0.08, 0);
  const astMat = new THREE.MeshStandardMaterial({ color: 0x8a7a68, roughness: 1.0, flatShading: true });
  const astInst = new THREE.InstancedMesh(baseGeo, astMat, astCount);
  const astData = [];
  const dummy = new THREE.Object3D();
  for (let i=0; i<astCount; i++){
    const r = 34 + Math.random()*7;
    const a = Math.random() * Math.PI * 2;
    const y = (Math.random()-0.5) * 1.5;
    const scale = 0.3 + Math.random()*1.5;
    astData.push({ r, a, y, speed: 0.15 + Math.random()*0.1, scale,
      rx: Math.random()*Math.PI, ry: Math.random()*Math.PI });
  }
  astInst.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  g.add(astInst);

  // Комета
  const comet = new THREE.Group();
  const cometHead = new THREE.Mesh(
    new THREE.SphereGeometry(0.15, 16, 16),
    new THREE.MeshBasicMaterial({ color:0xffffff }));
  comet.add(cometHead);
  const cometGlow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: makeGlowTex('rgba(255,255,255,1)', 'rgba(180,220,255,0.5)'),
    transparent:true, blending:THREE.AdditiveBlending, depthWrite:false }));
  cometGlow.scale.set(1.5, 1.5, 1);
  comet.add(cometGlow);

  const tailCount = Math.floor(700 * Q.particleScale);
  const tailGeo = new THREE.BufferGeometry();
  const tailPos = new Float32Array(tailCount * 3);
  const tailCol = new Float32Array(tailCount * 3);
  for (let i=0; i<tailCount; i++){
    const d = Math.random();
    tailPos[i*3] = d * 12;
    tailPos[i*3+1] = (Math.random()-0.5) * (0.5 + d*2);
    tailPos[i*3+2] = (Math.random()-0.5) * (0.5 + d*2);
    tailCol[i*3] = 0.6 + d*0.4;
    tailCol[i*3+1] = 0.8 + d*0.2;
    tailCol[i*3+2] = 1.0;
  }
  tailGeo.setAttribute('position', new THREE.BufferAttribute(tailPos, 3));
  tailGeo.setAttribute('color', new THREE.BufferAttribute(tailCol, 3));
  const tail = new THREE.Points(tailGeo, new THREE.PointsMaterial({
    size:0.1, vertexColors:true, transparent:true, opacity:0.75,
    blending:THREE.AdditiveBlending, sizeAttenuation:true, depthWrite:false }));
  comet.add(tail);
  g.add(comet);

  updaters.push((t, dt) => {
    for (let i=0; i<astCount; i++){
      const d = astData[i];
      d.a += dt * d.speed;
      dummy.position.set(Math.cos(d.a)*d.r, d.y, Math.sin(d.a)*d.r);
      dummy.rotation.set(d.rx + t*0.5, d.ry + t*0.3, 0);
      dummy.scale.setScalar(d.scale);
      dummy.updateMatrix();
      astInst.setMatrixAt(i, dummy.matrix);
    }
    astInst.instanceMatrix.needsUpdate = true;

    const cx = Math.cos(t*0.15) * 55;
    const cz = Math.sin(t*0.15) * 55;
    comet.position.set(cx, 3, cz);
    const dir = new THREE.Vector3(-cx, 0, -cz).normalize();
    comet.lookAt(comet.position.clone().add(dir.multiplyScalar(-100)));
    tail.rotation.y = Math.PI;
  });

  return g;
}

    updaters.push((t, dt) => { gal.rotation.y += gal.userData.spin * dt; });

      transparent:true, blending:THREE.AdditiveBlending, depthWrite:false }));
    s.scale.set(1.8, 1.8, 1);
    s.position.copy(n);
    g.add(s);
  });
  const lp = [];
  nodes.forEach((a, i) => {
    nodes.map((b, j) => ({ b, d: a.distanceTo(b), j }))
      .filter(o => o.j !== i).sort((x, y) => x.d - y.d).slice(0, 3)
      .forEach(({ b }) => lp.push(a.x, a.y, a.z, b.x, b.y, b.z));
  });
  const lg = new THREE.BufferGeometry();
  lg.setAttribute('position', new THREE.Float32BufferAttribute(lp, 3));
  g.add(new THREE.LineSegments(lg, new THREE.LineBasicMaterial({
    color:0x88aaff, transparent:true, opacity:0.22, blending:THREE.AdditiveBlending })));

  const t0 = Date.now();
  updaters.push(() => {
    const t = (Date.now() - t0)/1000;
    const s = 0.15 + Math.pow(Math.min(t/5, 1), 0.5);
    g.scale.set(s, s, s);
    g.rotation.y = t * 0.04;
  });
  return g;
}

function buildInfoParadox(){
  const g = new THREE.Group();
  g.add(makeStarField(Math.floor(Q.starCount*0.4)));
  g.add(new THREE.Mesh(
    new THREE.SphereGeometry(2.6, 48, 48),
    new THREE.MeshBasicMaterial({ color:0x000000 })));

    new THREE.TorusGeometry(3, 0.05, 12, 120),
    new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true, opacity:0.95,
      blending:THREE.AdditiveBlending, depthWrite:false }));
  photon.rotation.x = Math.PI/2;
  g.add(photon);

  const diskUniforms = { uTime: { value: 0 } };
  const diskMat = new THREE.ShaderMaterial({
    uniforms: diskUniforms,
    vertexShader: `varying vec3 vWorldPos; varying float vRadius;
      void main(){ vec4 wp = modelMatrix * vec4(position,1.0);
        vWorldPos = wp.xyz; vRadius = length(position.xy);
        gl_Position = projectionMatrix * viewMatrix * wp; }`,
    fragmentShader: `${GLSL_NOISE}
      uniform float uTime;
      varying vec3 vWorldPos; varying float vRadius;
      void main(){
        float r = vRadius;
        float a = atan(vWorldPos.y, vWorldPos.x);
        float spin = a - uTime * (3.0 / pow(r, 0.7));
        float n = fbm(vec3(spin*2.0, r*1.2, uTime*0.3));
        float heat = pow(1.0 - clamp((r - 3.0)/19.0, 0.0, 1.0), 1.8);
        heat *= 0.7 + n*0.5;
        float doppler = 0.6 + 0.4 * sin(a + uTime*0.5);
        vec3 col = mix(vec3(0.9,0.3,0.05), vec3(1.0,0.95,0.7), heat) * doppler;
        gl_FragColor = vec4(col, heat);
      }`,
    transparent:true, depthWrite:false,
    blending:THREE.AdditiveBlending, side:THREE.DoubleSide });
  const disk = new THREE.Mesh(new THREE.RingGeometry(3, 22, 128, 20), diskMat);
  disk.rotation.x = Math.PI/2;
  disk.rotation.z = 0.15;
  g.add(disk);

  const jetMat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 } },
    vertexShader: `varying vec2 vUv;
      void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `
      uniform float uTime;
      varying vec2 vUv;
      void main(){
        float y = vUv.y;
        float intensity = pow(1.0 - y, 2.0) * 0.9;
        intensity += sin(y*30.0 - uTime*4.0) * 0.15 + 0.15;
        gl_FragColor = vec4(0.7, 0.85, 1.0, intensity);
      }`,
    transparent:true, depthWrite:false,
    blending:THREE.AdditiveBlending, side:THREE.DoubleSide });
  const jetGeom = new THREE.CylinderGeometry(0.1, 1.2, 14, 16, 1, true);
  const jetTop = new THREE.Mesh(jetGeom, jetMat);
  jetTop.position.y = 7;
  g.add(jetTop);
  const jetBot = new THREE.Mesh(jetGeom, jetMat);
  jetBot.position.y = -7;
  jetBot.rotation.x = Math.PI;
  g.add(jetBot);

  lensingPass.uniforms.uStrength.value = 0.85;
  lensingPass.uniforms.uRadius.value = 0.10;
  lensingPass.uniforms.uCenter.value.set(0.5, 0.5);

  const lbl = makeLabel('ЧЁРНАЯ ДЫРА', 'гравитационная линза + джет', 22);
  lbl.position.set(0, 20, 0);
  g.add(lbl);

  updaters.push((t) => {
    diskUniforms.uTime.value = t;
    jetMat.uniforms.uTime.value = t;
    photon.material.opacity = 0.7 + Math.sin(t*4)*0.15;
    lensingPass.uniforms.uTime.value = t;
    lensingPass.uniforms.uStrength.value = 0.85 + Math.sin(t*2)*0.08;
  });
  return g;
}

function buildWhiteHole(){

    new THREE.SphereGeometry(2.6, 48, 48),

      transparent:true, blending:THREE.AdditiveBlending, depthWrite:false }));
    const s = 13 + i*9;
    glow.scale.set(s, s, 1);
    glow.userData = { base: s, phase: i*0.5 };
    g.add(glow);
    updaters.push((t) => {
      const k = glow.userData.base * (1 + Math.sin(t*1.6 + glow.userData.phase) * 0.12);
      glow.scale.set(k, k, 1);
    });
  }
  const photon = new THREE.Mesh(

  const N = Math.floor(2500 * Q.particleScale);
  const pos = new Float32Array(N*3);
  const col = new Float32Array(N*3);
  const vel = [];
  for (let i=0; i<N; i++){
    const a = Math.random()*Math.PI*2;
    const b = Math.acos(2*Math.random()-1);
    vel.push({ x:Math.sin(b)*Math.cos(a), y:Math.cos(b), z:Math.sin(b)*Math.sin(a),
              r:3, speed:5 + Math.random()*12 });
    col[i*3]=1.0; col[i*3+1]=0.85 + Math.random()*0.15; col[i*3+2]=0.5 + Math.random()*0.5;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g.add(new THREE.Points(geo, new THREE.PointsMaterial({
    size:0.28, vertexColors:true, transparent:true, opacity:0.9,
    blending:THREE.AdditiveBlending, sizeAttenuation:true, depthWrite:false })));

  const lbl = makeLabel('БЕЛАЯ ДЫРА', 'время наоборот: ничего не входит, всё вылетает', 24);
  lbl.position.set(0, 22, 0);
  g.add(lbl);

  updaters.push((t, dt) => {
    photon.material.opacity = 0.75 + Math.sin(t*3)*0.2;
    const p = geo.attributes.position.array;
    vel.forEach((v, i) => {
      v.r += v.speed * dt;
      if (v.r > 55){
        v.r = 3;
        const a = Math.random()*Math.PI*2;
        const b = Math.acos(2*Math.random()-1);
        v.x = Math.sin(b)*Math.cos(a); v.y = Math.cos(b); v.z = Math.sin(b)*Math.sin(a);
      }
      p[i*3] = v.x*v.r; p[i*3+1] = v.y*v.r; p[i*3+2] = v.z*v.r;
    });
    geo.attributes.position.needsUpdate = true;
  });
  return g;
}

function buildCosmicBrain(){

        (Math.random()-0.5)*24,

      blending:THREE.AdditiveBlending, sizeAttenuation:true, depthWrite:false })));

  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  const bands = [
    ['#c9a882',0.00,0.07],['#e8d9b8',0.07,0.12],['#b8875a',0.12,0.20],
    ['#e8d9b8',0.20,0.26],['#c9a882',0.26,0.34],['#e8d9b8',0.34,0.42],
    ['#c9a882',0.42,0.50],['#b8875a',0.50,0.58],['#e8d9b8',0.58,0.66],
    ['#c9a882',0.66,0.74],['#b8875a',0.74,0.82],['#c9a882',0.82,0.90],
    ['#e8d9b8',0.90,1.00]
  ];
  bands.forEach(([c,y1,y2]) => {
    ctx.fillStyle = c;
    ctx.fillRect(0, y1*H, W, (y2-y1)*H);
  });
  for (let i=0; i<3000; i++){
    ctx.fillStyle = `rgba(${Math.random()>0.5?'255,255,255':'80,50,30'},${Math.random()*0.11})`;

    ctx.ellipse(Math.random()*W, Math.random()*H,

    ctx.fill();
  }
  const sx = W*0.62, sy = H*0.62, srx = W*0.075, sry = H*0.075;
  const rg = ctx.createRadialGradient(sx, sy, 0, sx, sy, srx);
  rg.addColorStop(0, '#ff9955'); rg.addColorStop(0.5, '#cc4422'); rg.addColorStop(1, '#8a2211');
  ctx.fillStyle = rg;
  ctx.beginPath();
  ctx.ellipse(sx, sy, srx, sry, 0, 0, Math.PI*2);
  ctx.fill();
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  const nm = heightmapToNormal(cv);

  const jup = new THREE.Mesh(

/* =========================================================
   22. КВАНТОВОЕ БЕССМЕРТИЕ
========================================================= */
function buildQuantumImmortality(){
  const g = new THREE.Group();
  g.add(makeStarField(Math.floor(Q.starCount*0.4)));
  const branches = [];
  const rootPos = new THREE.Vector3(0, -18, 0);
  function makeBranch(from, dir, length, depth, color){
    if (depth > 4) return;
    const to = from.clone().add(dir.clone().multiplyScalar(length));
    const geo = new THREE.BufferGeometry().setFromPoints([from, to]);
    g.add(new THREE.Line(geo, new THREE.LineBasicMaterial({
      color, transparent:true, opacity:0.85, blending:THREE.AdditiveBlending })));
    const node = new THREE.Mesh(
      new THREE.SphereGeometry(0.25 + (4 - depth) * 0.1, 12, 12),
      new THREE.MeshBasicMaterial({
        color: depth === 4 ? 0xffee66 : 0x88ccff,
        transparent:true, opacity:0.9 }));
    node.position.copy(to);
    g.add(node);
    branches.push({ node, baseScale: node.scale.x, phase: Math.random()*Math.PI*2 });
    for (let i=0; i<2; i++){
      const angle = (i === 0 ? -1 : 1) * (0.4 + Math.random()*0.2);
      const newDir = dir.clone().applyAxisAngle(new THREE.Vector3(0,0,1), angle).normalize();
      const newColor = new THREE.Color(color).offsetHSL(0.04, 0, 0.1);
      makeBranch(to, newDir, length * 0.7, depth + 1, newColor.getHex());
    }
  }
  const up = new THREE.Vector3(0, 1, 0);
  makeBranch(rootPos, up.clone().applyAxisAngle(new THREE.Vector3(0,0,1), -0.15), 5, 0, 0xffffff);
  makeBranch(rootPos, up.clone(), 5, 0, 0xffffff);
  makeBranch(rootPos, up.clone().applyAxisAngle(new THREE.Vector3(0,0,1), 0.15), 5, 0, 0xffffff);
  const you = new THREE.Mesh(
    new THREE.SphereGeometry(0.9, 20, 20),
    new THREE.MeshBasicMaterial({ color:0xffcc44 }));
  you.position.copy(rootPos);
  g.add(you);
  const youGlow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: makeGlowTex('rgba(255,220,140,1)', 'rgba(255,160,60,0.7)'),
    transparent:true, blending:THREE.AdditiveBlending, depthWrite:false }));
  youGlow.scale.set(8, 8, 1);
  youGlow.position.copy(rootPos);
  g.add(youGlow);
  const lbl = makeLabel('КВАНТОВОЕ БЕССМЕРТИЕ', 'в какой-то ветке ты всегда жив', 26);
  lbl.position.set(0, 26, 0);
  g.add(lbl);
  const warn = makeLabel('⚠ это теория, не проверяй', null, 18, '#ff8866');
  warn.position.set(0, 22, 0);
  g.add(warn);
  updaters.push((t) => {
    const s = 8 + Math.sin(t*2)*0.8;
    youGlow.scale.set(s, s, 1);
    branches.forEach(b => {
      const flicker = 0.5 + 0.5 * Math.sin(t*3 + b.phase);
      b.node.material.opacity = 0.3 + flicker * 0.7;
      const sc = b.baseScale * (0.8 + flicker * 0.5);
      b.node.scale.set(sc, sc, sc);
    });
    g.rotation.y = Math.sin(t*0.1) * 0.3;
  });
  return g;
}

/* =========================================================
   23. МЫ НЕ КАСАЛИСЬ
========================================================= */
function buildNoTouch(){
  const g = new THREE.Group();
  g.add(makeStarField(Math.floor(Q.starCount*0.3)));
  const makeHand = (sign) => {
    const handGroup = new THREE.Group();
    const palmCnt = Math.floor(2000 * Q.particleScale);
    const palmPos = [];
    for (let i=0; i<palmCnt; i++){
      const r = Math.pow(Math.random(), 0.5) * 3;
      const a = Math.random()*Math.PI*2;
      palmPos.push(Math.cos(a)*r*0.6, Math.sin(a)*r, Math.sin(a*2)*0.5);
    }
    const palmGeo = new THREE.BufferGeometry();
    palmGeo.setAttribute('position', new THREE.Float32BufferAttribute(palmPos, 3));
    handGroup.add(new THREE.Points(palmGeo, new THREE.PointsMaterial({
      color: 0xffddbb, size:0.18, transparent:true, opacity:0.65,
      blending:THREE.AdditiveBlending, sizeAttenuation:true, depthWrite:false })));
    const fingerCnt = Math.floor(1000 * Q.particleScale);
    const fPos = [];
    for (let i=0; i<fingerCnt; i++){
      const t = Math.random();
      const r = t * 3.5;
      const a = (Math.random()-0.5) * 0.35;
      fPos.push(
        sign * (r + 3.2),
        Math.sin(a) * 0.6 + 0.5,
        Math.cos(a)*0.6 - 0.6 + (Math.random()-0.5)*0.3 );
    }
    const fGeo = new THREE.BufferGeometry();
    fGeo.setAttribute('position', new THREE.Float32BufferAttribute(fPos, 3));
    handGroup.add(new THREE.Points(fGeo, new THREE.PointsMaterial({
      color: 0xffddbb, size:0.18, transparent:true, opacity:0.75,
      blending:THREE.AdditiveBlending, sizeAttenuation:true, depthWrite:false })));
    return handGroup;
  };
  const leftHand = makeHand(1);
  leftHand.position.set(-9, 0, 0);
  leftHand.rotation.z = -0.1;
  g.add(leftHand);
  const rightHand = makeHand(-1);
  rightHand.position.set(9, 0, 0);
  rightHand.rotation.z = 0.1;
  g.add(rightHand);
  const sparkCnt = Math.floor(800 * Q.particleScale);
  const sparkGeo = new THREE.BufferGeometry();
  const sparkPos = new Float32Array(sparkCnt*3);
  const sparkVel = [];
  for (let i=0; i<sparkCnt; i++){
    sparkPos[i*3] = (Math.random()-0.5)*4;
    sparkPos[i*3+1] = (Math.random()-0.5)*2;
    sparkPos[i*3+2] = (Math.random()-0.5)*1;
    sparkVel.push({
      vx:(Math.random()-0.5)*0.5, vy:(Math.random()-0.5)*0.5, vz:(Math.random()-0.5)*0.5 });
  }
  sparkGeo.setAttribute('position', new THREE.BufferAttribute(sparkPos, 3));
  g.add(new THREE.Points(sparkGeo, new THREE.PointsMaterial({
    color:0xffcc44, size:0.15, transparent:true, opacity:0.9,
    blending:THREE.AdditiveBlending, sizeAttenuation:true, depthWrite:false })));
  const lbl = makeLabel('ВЫ НИКОГДА НИЧЕГО НЕ КАСАЛИСЬ', 'электроны отталкиваются — контакта нет', 36);
  lbl.position.set(0, 12, 0);
  g.add(lbl);
  const sublbl = makeLabel('И НИКОГДА НЕ КОСНЁТЕСЬ', null, 26, '#ffcc88');
  sublbl.position.set(0, -12, 0);
  g.add(sublbl);
  updaters.push((t, dt) => {
    const sp = sparkGeo.attributes.position.array;
    for (let i=0; i<sparkCnt; i++){
      sparkVel[i].vx += (Math.random()-0.5)*0.15;
      sparkVel[i].vy += (Math.random()-0.5)*0.15;
      sparkVel[i].vz += (Math.random()-0.5)*0.15;
      sparkVel[i].vx *= 0.9; sparkVel[i].vy *= 0.9; sparkVel[i].vz *= 0.9;
      sp[i*3]   += sparkVel[i].vx * dt;
      sp[i*3+1] += sparkVel[i].vy * dt;
      sp[i*3+2] += sparkVel[i].vz * dt;
      if (Math.abs(sp[i*3]) > 2.5) sparkVel[i].vx *= -1;
      if (Math.abs(sp[i*3+1]) > 1.5) sparkVel[i].vy *= -1;
    }
    sparkGeo.attributes.position.needsUpdate = true;
    const reach = Math.sin(t * 0.6) * 0.5 + 0.5;
    leftHand.position.x = -9 + reach * 2.5;
    rightHand.position.x = 9 - reach * 2.5;
  });
  return g;
}

========================================================= */
function buildHeatDeath(){
  const g = new THREE.Group();
  const c = Math.floor(Q.starCount * 0.5);
  const pos = [], col = [];
  for (let i=0; i<c; i++){
    const a = Math.random()*Math.PI*2;
    const p = Math.acos(2*Math.random()-1);
    const r = 40 + Math.random()*80;
    pos.push(r*Math.sin(p)*Math.cos(a), r*Math.cos(p), r*Math.sin(p)*Math.sin(a));
    const d = 0.25 + Math.random()*0.4;
    col.push(d, d*0.4, d*0.15);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.add(new THREE.Points(geo, new THREE.PointsMaterial({
    size:0.9, vertexColors:true, transparent:true, opacity:0.65,
    sizeAttenuation:true, depthWrite:false })));
  g.add(new THREE.Mesh(
    new THREE.SphereGeometry(120, 32, 32),
    new THREE.MeshBasicMaterial({ color:0x180808, transparent:true, opacity:0.35, side:THREE.BackSide })));
  updaters.push((t, dt) => {
    const p = geo.attributes.position;
    for (let i=0; i<p.count; i++){
      p.setX(i, p.getX(i)*(1 + dt*0.015));
      p.setY(i, p.getY(i)*(1 + dt*0.015));
      p.setZ(i, p.getZ(i)*(1 + dt*0.015));
    }
    p.needsUpdate = true;
  });
  return g;
}

    { cA:'#ffddaa', cB:'#aa88ff' },

    { cA:'#ffe0c0', cB:'#ff8866' }

      cA: p.cA, cB: p.cB });

    const phi = Math.acos(2*Math.random()-1);
    const R = 5 + Math.random()*25;
    gal.position.set(
      R*Math.sin(phi)*Math.cos(theta),
      R*Math.cos(phi),
      R*Math.sin(phi)*Math.sin(theta));
    gal.userData = { dir: gal.position.clone().normalize(), r: R, start: Math.random()*3 };
    g.add(gal);
    gals.push(gal);
  }
  const t0 = Date.now();
  updaters.push(() => {
    const t = (Date.now() - t0)/1000;
    gals.forEach(gal => {
      const lt = Math.max(0, t - gal.userData.start);
      const r = gal.userData.r + Math.pow(lt, 1.7) * 10;
      gal.position.copy(gal.userData.dir).multiplyScalar(r);
      gal.rotation.y += 0.02;
    });
  });
  return g;
}

function buildBigCrunch(){
  const g = new THREE.Group();

  for (let i=0; i<30; i++){
    const gal = makeGalaxy({
      radius: 2 + Math.random()*1.5, armCount: 2,
      starCount: Math.floor(600 * Q.particleScale),
      dustCount: Math.floor(120 * Q.particleScale),
      cA:'#ffe0aa', cB:'#ff9944' });
    const theta = Math.random()*Math.PI*2;
    const phi = Math.acos(2*Math.random()-1);
    const R = 50 + Math.random()*70;
    gal.position.set(
      R*Math.sin(phi)*Math.cos(theta),
      R*Math.cos(phi),
      R*Math.sin(phi)*Math.sin(theta));
    gal.userData = { dir: gal.position.clone().normalize(), baseR: R };
    g.add(gal);
    gals.push(gal);
  }
  const core = new THREE.Sprite(new THREE.SpriteMaterial({
    map: makeGlowTex('rgba(255,255,255,1)', 'rgba(255,180,80,0.9)'),
    transparent:true, blending:THREE.AdditiveBlending, depthWrite:false }));
  g.add(core);
  const t0 = Date.now();
  updaters.push(() => {
    const t = (Date.now() - t0)/1000;
    const cyc = (t % 14) / 14;
    const phase = cyc < 0.5 ? cyc*2 : (1 - cyc)*2;
    const scale = 1.2 - phase*0.95;
    gals.forEach(gal => {
      gal.position.copy(gal.userData.dir).multiplyScalar(gal.userData.baseR * scale);
      gal.rotation.y += 0.03;
    });
    const cs = 4 + phase*55;
    core.scale.set(cs, cs, 1);
  });
  return g;
}

  { key:'g', label:'💨 Большой разрыв', title:'БОЛЬШОЙ РАЗРЫВ',
    info:'Галактики разлетятся.',
    cam:[0,45,140], target:[0,0,0], build: buildBigRip },
  { key:'h', label:'🌀 Большое сжатие', title:'БОЛЬШОЕ СЖАТИЕ',
    info:'Всё сожмётся в точку.',
    cam:[0,45,150], target:[0,0,0], build: buildBigCrunch },
  { key:'*', label:'🌅 CARPE DIEM', title:'ЛОВИ МОМЕНТ',
    info:'Вселенная огромна. Но пока мы здесь — живите настоящим.',
    cam:[0,0,45], target:[0,0,0], build: buildCarpeDiem }
];

/* =========================================================
   УПРАВЛЕНИЕ
========================================================= */
const menuEl = $el('menu', 'div');
const titleEl = $el('title', 'div');
const infoEl = $el('info', 'div');
const bigTextEl = $el('big-text', 'div');
let camAnim = null;
let bigTextTimer = null;

function showBigText(text){
  if (!bigTextEl) return;
  bigTextEl.textContent = text;
  bigTextEl.style.opacity = '1';
  clearTimeout(bigTextTimer);
  bigTextTimer = setTimeout(() => { bigTextEl.style.opacity = '0'; }, 2400);
}

function switchScene(idx, btn){
  if (idx === currentIdx) return;
  currentIdx = idx;
  try {
    document.querySelectorAll('#menu button').forEach(b => b.classList.remove('active'));
  } catch(e){}
  if (btn && btn.classList) btn.classList.add('active');
  const s = scenes[idx];
  clearScene();
  try {
    sceneRoot.add(s.build());
  } catch(e){
    window.__error('Построение сцены: ' + e.message);
    console.error(e);
    return;
  }
  if (titleEl) titleEl.textContent = s.title;
  if (infoEl) infoEl.textContent = s.info;
  camAnim = {
    fromPos: camera.position.clone(),
    toPos: new THREE.Vector3(...s.cam),
    fromTarget: controls.target.clone(),
    toTarget: new THREE.Vector3(...s.target),
    t: 0
  };
  if (s.key === '*') showBigText('CARPE DIEM');
}

scenes.forEach((s, i) => {
  const btn = document.createElement('button');
  btn.textContent = s.label;
  btn.onclick = () => switchScene(i, btn);
  menuEl.appendChild(btn);
});

addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  const idx = scenes.findIndex(s => s.key === k);
  if (idx >= 0){
    switchScene(idx, document.querySelectorAll('#menu button')[idx]);
  }
});

/* Цикл */
const clock = new THREE.Clock();
let totalT = 0;

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  totalT += dt;
  updaters.forEach(fn => {
    try { fn(totalT, dt); } catch(e){}
  });
  if (camAnim){
    camAnim.t = Math.min(1, camAnim.t + dt*1.1);
    const e = 1 - Math.pow(1 - camAnim.t, 3);
    camera.position.lerpVectors(camAnim.fromPos, camAnim.toPos, e);
    controls.target.lerpVectors(camAnim.fromTarget, camAnim.toTarget, e);
    if (camAnim.t >= 1) camAnim = null;
  }
  postFxPass.uniforms.uTime.value = totalT;
  controls.update();
  composer.render();
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  postFxPass.uniforms.uResolution.value.set(innerWidth, innerHeight);
});

/* Старт */
window.__progress('готово, строим первую сцену…');
requestAnimationFrame(() => {
  requestAnimationFrame(() => {
    try {
      switchScene(0, document.querySelectorAll('#menu button')[0]);
      const loading = $el('loading', 'div');
      if (loading) loading.style.opacity = '0';
      setTimeout(() => {
        const l = $el('loading', 'div');
        if (l) l.style.display = 'none';
      }, 600);
    } catch(e){
      window.__error('Финальная ошибка: ' + e.message);
      console.error(e);
    }
  });
});
</script>
</body>
</html>
